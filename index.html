    <script>
        let playingConfetti = false;

        function playConfetti() {
            if(playingConfetti) {
                return;
            }

            playingConfetti = true;
            const duration = 15 * 1000,
            animationEnd = Date.now() + duration,
            defaults = { 
                startVelocity: 30, 
                spread: 360, 
                ticks: 60, 
                zIndex: 0,
                scalar: 3,
                shapes: ["image"],
                shapeOptions: {
                    image: [
                        {
                            src: "kweebec.webp",
                            width: 32,
                            height: 32,
                        },
                        {
                            src: "kweebec2.webp",
                            width: 32,
                            height: 32,
                        },
                        {
                            src: "kweebec3.webp",
                            width: 32,
                            height: 32,
                        }
                    ],
                }
            };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    playingConfetti = false;
                    return clearInterval(interval);
                }

                const particleCount = 15 * (timeLeft / duration);

                confetti(
                    Object.assign({}, defaults, {
                    particleCount,
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 },
                    })
                );
                confetti(
                    Object.assign({}, defaults, {
                    particleCount,
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 },
                    })
                );
            }, 250);
        }

        const subtitleElement = document.getElementById("subtitle");
        const buttonElement = document.getElementById("switch-button-content");
        const dateElement = document.getElementById("final-date");

        // Once pre-orders are live, change poCompleted = true and release = true and re-deploy :)

        const poSubtitle = "Pre-Orders Go Live In";
        const poDate = Date.UTC(2025, 11, 13, 15, 0, 0);
        const poDateText = "13th December 2025 (10AM EST)";
        const poButtonText = "Switch To Release Countdown";
        const poAnnouncement = "Hytale's Pre-Orders<br>are now Live!"
        let poCompleted = false;

        const rlSubtitle = "EA Release Goes Live In";
        const rlDate = Date.UTC(2026, 0, 13, 15, 0, 0);
        const rlDateText = "13th January 2026 (10AM EST)";
        const rlButtonText = "Switch To Pre-Order Countdown";
        const rlAnnouncement = "Hytale's Early Access<br>has been released!"
        let rlCompleted = false;

        let release = false;
        let targetDate = poDate;

        let day = document.getElementById("day");
        let hour = document.getElementById("hour");
        let minute = document.getElementById("minute");
        let second = document.getElementById("second");
        let day2 = document.getElementById("day2");
        let hour2 = document.getElementById("hour2");
        let minute2 = document.getElementById("minute2");
        let second2 = document.getElementById("second2");

        const msday = 1000 * 60 * 60 * 24;
        const mshour = 1000 * 60 * 60;
        const msmin = 1000 * 60;

        let completed = false;
        let switched = false;

        function setupData(isRelease) {
            let dateText = poDateText;

            if(isRelease) {
                dateText = rlDateText;
            }

            document.getElementById("countdown").innerHTML = `
                <div id="countdown-inner">
                    <div class="unit">
                        <span class="number" id="day">0</span>
                        <span class="number" id="day2">0</span>
                        <span class="unit-symbol">d</span>
                    </div>
                    <div class="unit">
                        <span class="number" id="hour">0</span>
                        <span class="number" id="hour2">0</span>
                        <span class="unit-symbol">h</span>
                    </div>
                    <div class="unit">
                        <span class="number" id="minute">0</span>
                        <span class="number" id="minute2">0</span>
                        <span class="unit-symbol">m</span>
                    </div>
                    <div class="unit">
                        <span class="number" id="second">0</span>
                        <span class="number" id="second2">0</span>
                        <span class="unit-symbol">s</span>
                    </div>
                </div>
                <span class="final-date" id="final-date">${dateText}</span>
            `;

            day = document.getElementById("day");
            hour = document.getElementById("hour");
            minute = document.getElementById("minute");
            second = document.getElementById("second");
            day2 = document.getElementById("day2");
            hour2 = document.getElementById("hour2");
            minute2 = document.getElementById("minute2");
            second2 = document.getElementById("second2");
            
            if(release) {
                targetDate = rlDate;
                subtitleElement.innerHTML = rlSubtitle;
                buttonElement.innerHTML = rlButtonText;
                dateElement.innerHTML = rlDateText;
            } else {
                targetDate = poDate;
                subtitleElement.innerHTML = poSubtitle;
                buttonElement.innerHTML = poButtonText;
                dateElement.innerHTML = poDateText;
            }

            updateCountdown();
        }

        function switchTimer() {
            switched = true;
            release = !release;
            setupData(release);
        }

        function playAnim(doConfetti) {
            document.getElementById("countdown-inner").classList.add("fade-out");
            document.getElementById("final-date").classList.add("fade-out");

            setTimeout(() => {
                let announcementText = poAnnouncement;
                if(release) {
                    announcementText = rlAnnouncement;
                }

                document.getElementById("countdown").innerHTML = `
                <div class="end-wrapper" id="end">
                    <span class="announced">${announcementText}</span>
                    <a href="https://store.hytale.com/" class="link" target="_blank">Click Here To Pre-Order The Game!</a>
                </div>
                `;
                setTimeout(() => {
                    document.getElementById("end").classList.add("fade-in");
                    if (doConfetti) {
                        playConfetti();
                    }
                }, 300);
            }, 250);
        }

        function updateCountdown() {
            const endDate = new Date(targetDate);
            const now = new Date();
            const diff = endDate - now;

            if (diff <= 0) {
                let justCompleted = false;

                if(release) {
                    justCompleted = !rlCompleted;
                    rlCompleted = true;
                } else {
                    justCompleted = !poCompleted;
                    poCompleted = true;
                }

                if (switched) {
                    switched = false;
                    playAnim(false);
                }

                if (!justCompleted) {
                    return;
                }

                playAnim(true);
            } else {
                const days = Math.floor(diff / msday);
                const hours = Math.floor((diff % msday) / mshour);
                const minutes = Math.floor((diff % mshour) / msmin);
                const seconds = Math.floor((diff % msmin) / 1000);

                day.textContent = Math.floor(days / 10);
                hour.textContent = Math.floor(hours / 10);
                minute.textContent = Math.floor(minutes / 10);
                second.textContent = Math.floor(seconds / 10);
                
                day2.textContent = days % 10;
                hour2.textContent = hours % 10;
                minute2.textContent = minutes % 10;
                second2.textContent = seconds % 10;
            }
        }

        setupData(release);
        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
